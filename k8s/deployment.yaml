apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-batch-service
  namespace: default
  labels:
    app.kubernetes.io/name: order-batch-service
    app.kubernetes.io/component: batch-processor
    app.kubernetes.io/part-of: serverless-batch-order-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-batch-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-batch-service
        app.kubernetes.io/component: batch-processor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: order-batch-service
          image: order-batch-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: AWS_REGION
              value: "us-east-1"
            - name: ORDERS_BUCKET_NAME
              value: "financial-orders-bucket"
            - name: ORDERS_CSV_PREFIX
              value: "incoming/csv/"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: order-batch-db-secret
                  key: db-host
                  optional: true
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: order-batch-db-secret
                  key: db-user
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-batch-db-secret
                  key: db-password
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
